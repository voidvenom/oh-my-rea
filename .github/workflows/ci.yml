name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Localized CLI tests under a Turkish host environment
        env:
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8
          LC_MESSAGES: tr_TR.UTF-8
          LANGUAGE: tr
          OMR_LANG: tr
        run: node --test test/i18n.test.mjs test/update-notice.test.mjs
