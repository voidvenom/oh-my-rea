name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.23.4", "24.22.1", "26.12.1"]
        include:
          - os: ubuntu-24.04-arm
            node: "24.22.1"
          - os: macos-15-intel
            node: "24.22.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack, install and run the CLI without REA; typecheck and run the installed SDK
        run: npm run test:package
      - name: Install Turkish locale for the locale-specific check
        if: runner.os == 'Linux' && matrix.node == '24.22.1'
        run: sudo locale-gen tr_TR.UTF-8
      - name: Localized CLI tests under a Turkish host environment
        if: runner.os == 'Linux' && matrix.node == '24.22.1'
        env:
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8
          LC_MESSAGES: tr_TR.UTF-8
          LANGUAGE: tr
          OMR_LANG: tr
        run: node --test test/i18n.test.mjs test/update-notice.test.mjs
